<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drishtim · Calendar</title>
<style>
  :root{
    --bg:#FBF8F3; --ink:#241A20; --red:#C13437; --muted:#6E655C;
    --line:#E4DDD2; --card:#FFFFFF; --shade:#F4EFE6;
    --amber:#B77A16; --green:#3F7D53; --blue:#2F5F7D; --plum:#5C4551;
    --ram:#241A20; --bipin:#5C4551; --shivam:#2F5F7D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column}

  /* ---------- header ---------- */
  header{background:var(--ink);color:#fff;flex:0 0 auto}
  .hrow{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
  .brand{font-size:15px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .brand span{color:#B4ABA2;font-weight:400}
  .nav{display:flex;align-items:center;gap:6px;margin-left:6px}
  .nav button{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.22);
    background:transparent;color:#fff;font-size:16px;cursor:pointer;line-height:1;font-family:inherit}
  .nav button:hover{background:rgba(255,255,255,.12)}
  .mtitle{font-size:19px;font-weight:700;min-width:190px;text-align:center;white-space:nowrap}
  .spacer{flex:1}
  .pill{border:1px solid rgba(255,255,255,.22);background:transparent;color:#C9C2BA;
    border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;
    white-space:nowrap}
  .pill:hover{background:rgba(255,255,255,.1);color:#fff}
  .pill.on{background:#fff;color:var(--ink);border-color:#fff}
  .grp{display:flex;gap:4px}
  .who{display:flex;align-items:center;gap:5px}
  .dotp{width:8px;height:8px;border-radius:50%;display:inline-block}

  .sub{display:flex;align-items:center;gap:10px;padding:0 16px 10px;flex-wrap:wrap;
    font-size:11.5px;color:#B4ABA2}
  .sub b{color:#fff;font-weight:600}
  .lg{display:flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:3px;display:inline-block}

  /* ---------- month grid ---------- */
  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:10px 12px 12px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:0 0 auto;margin-bottom:6px}
  .dow div{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);text-align:center;padding:2px 0}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;flex:1 1 auto;min-height:0}

  .cell{background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:5px 6px;overflow:hidden;display:flex;flex-direction:column;min-height:0;cursor:pointer;
    transition:border-color .12s}
  .cell:hover{border-color:var(--muted)}
  .cell.out{background:transparent;border-color:transparent;cursor:default}
  .cell.out:hover{border-color:transparent}
  .cell.today{border-color:var(--ink);border-width:2px;padding:4px 5px}
  .cell.p-peak{background:#FAE9E9}
  .cell.p-quiet{background:#EBE7E0}
  .cell.p-veg{background:#F7EFDF}

  .cn{display:flex;align-items:baseline;gap:6px;flex:0 0 auto}
  .cn .n{font-size:14px;font-weight:700}
  .cell.out .n{color:#C9C2BA}
  .cn .f{font-size:9.5px;font-weight:700;color:var(--red);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .items{flex:1 1 auto;min-height:0;overflow:hidden;margin-top:3px;display:flex;flex-direction:column;gap:2px}

  .it{font-size:10.5px;line-height:1.25;padding:2px 4px;border-radius:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
  .it.c{color:#fff;font-weight:700}
  .it.c.static{background:var(--blue)}
  .it.c.reel{background:var(--red)}
  .it.c.story{background:var(--amber)}
  .it.t{background:var(--shade);border-left:3px solid var(--muted);color:var(--ink)}
  .it.t.Ram{border-left-color:var(--ram)}
  .it.t.Bipin{border-left-color:var(--bipin)}
  .it.t.Shivam{border-left-color:var(--shivam)}
  .it.t.done{opacity:.45;text-decoration:line-through}
  .it.t.blocked{background:#FBE9E9;color:#9E2124}
  .it.m{background:var(--ink);color:#fff;font-weight:700}
  .it.s{background:var(--green);color:#fff;font-weight:700}
  .more{font-size:10px;color:var(--muted);font-weight:700;padding-left:4px;flex:0 0 auto}

  /* ---------- agenda ---------- */
  .agenda{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}
  .aday{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .aday:last-child{border-bottom:none}
  .adate{text-align:right}
  .adate .dn{font-size:26px;font-weight:700;line-height:1}
  .adate .dw{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .adate .ft{font-size:10.5px;color:var(--red);font-weight:700;margin-top:4px;line-height:1.25}
  .adate.today .dn{color:var(--red)}
  .arow{display:flex;align-items:flex-start;gap:9px;padding:5px 0}
  .arow .tag{flex:0 0 auto;font-size:9.5px;font-weight:800;color:#fff;border-radius:4px;padding:2px 6px;margin-top:2px}
  .arow .bd{flex:1;min-width:0}
  .arow .t1{font-size:13.5px;font-weight:600}
  .arow .t2{font-size:11.5px;color:var(--muted);margin-top:1px}
  .own{flex:0 0 auto;font-size:10px;font-weight:800;color:#fff;border-radius:100px;padding:2px 8px;margin-top:2px}
  .aempty{color:var(--muted);font-size:12.5px;font-style:italic;padding:4px 0}

  /* ---------- day panel ---------- */
  .ov{position:fixed;inset:0;background:rgba(36,26,32,.4);display:none;z-index:60}
  .ov.on{display:block}
  .panel{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--bg);
    z-index:61;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
  .panel.on{transform:none}
  .ph{background:var(--ink);color:#fff;padding:16px 18px;flex:0 0 auto}
  .ph .d1{font-size:23px;font-weight:700}
  .ph .d2{font-size:12.5px;color:#C9C2BA;margin-top:3px}
  .ph .x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;
    border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;cursor:pointer;font-size:15px;font-family:inherit}
  .pb{flex:1 1 auto;overflow-y:auto;padding:14px 18px 24px}
  .sect{margin-bottom:18px}
  .sect h4{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 8px}
  .pcard{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:9px;
    padding:9px 11px;margin-bottom:7px}
  .pcard.Ram{border-left-color:var(--ram)}
  .pcard.Bipin{border-left-color:var(--bipin)}
  .pcard.Shivam{border-left-color:var(--shivam)}
  .pcard .t{font-size:13.5px;font-weight:600;line-height:1.3}
  .pcard .c{font-size:11.5px;color:var(--muted);margin-top:3px}
  .pcard .m{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .chip{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 7px;border-radius:100px}
  .c-ink{background:var(--ink);color:#fff}
  .c-todo{background:var(--shade);color:var(--muted)}
  .c-doing{background:#E9EFF3;color:#2F5F7D}
  .c-blocked{background:#FBE9E9;color:#9E2124}
  .c-review{background:#FBF0DC;color:#8A5B0C}
  .c-done{background:#E7F1E9;color:#2F6440}
  .pnone{color:var(--muted);font-size:12.5px;font-style:italic}
  .shoot{background:#E7F1E9;border:1px solid #BFD9C7;border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .shoot .n{font-size:14px;font-weight:700;color:#2F6440}
  .shoot .s{font-size:12px;color:#3F5C48;margin-top:4px;line-height:1.45}
  .fest{background:#FBE9E9;border:1px solid #E8C7C8;border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .fest .n{font-size:14px;font-weight:700;color:#9E2124}
  .fest .s{font-size:12px;color:#9E2124;margin-top:3px;opacity:.85}

  footer{flex:0 0 auto;padding:6px 16px 8px;font-size:11px;color:var(--muted);
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}

  @media (max-width:820px){
    .grid{grid-auto-rows:minmax(78px,1fr)}
    main{overflow-y:auto}
    .mtitle{min-width:auto;font-size:16px}
    .hrow{gap:8px;padding:8px 10px}
  }
  /* Phone: a month cell is too narrow for text, so the grid becomes dots.
     Tap the day to read it. Date-wise is the default view down here. */
  @media (max-width:700px){
    .grid{gap:4px;grid-auto-rows:minmax(62px,1fr)}
    .cell{padding:4px;border-radius:7px}
    .cn .n{font-size:12.5px}
    .cn .f{display:none}
    .cell .items{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:3px;margin-top:4px}
    .cell .it{width:7px;height:7px;padding:0;border-radius:50%;flex:0 0 auto;
      text-indent:-999em;line-height:0;border-left:none!important;overflow:hidden}
    .cell .it.t{background:var(--muted)}
    .cell .it.s{background:var(--green)}
    .cell .it.t.Ram{background:var(--ram)}
    .cell .it.t.Bipin{background:var(--bipin)}
    .cell .it.t.Shivam{background:var(--shivam)}
    .cell .it.t.done{opacity:.3}
    .cell .it.t.blocked{background:var(--red)}
    .cell .more{display:none!important}
    .cell.fest-day .n{color:var(--red)}
    .aday{grid-template-columns:64px 1fr;gap:10px}
    .adate .dn{font-size:21px}
  }
  @media print{
    header{background:#fff;color:#000}
    .nav,.pill,.grp,footer,.sub{display:none!important}
    .mtitle{color:#000}
    html,body{overflow:visible;height:auto}
    .cell{break-inside:avoid}
  }
</style>
</head>

<header>
  <div class="hrow">
    <div class="brand">Drishtim <span>· Calendar</span></div>
    <div class="nav">
      <button id="prev" title="Previous month">‹</button>
      <div class="mtitle" id="mtitle">—</div>
      <button id="next" title="Next month">›</button>
    </div>
    <button class="pill" id="today">Today</button>
    <div class="spacer"></div>
    <div class="grp">
      <button class="pill on" data-view="month">Month</button>
      <button class="pill" data-view="agenda">Date-wise</button>
    </div>
    <div class="grp" id="people"></div>
    <div class="grp" id="clients"></div>
    <button class="pill" id="printBtn">Print</button>
  </div>
  <div class="sub" id="sub"></div>
</header>

<main>
  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>
  <div class="agenda" id="agenda" style="display:none"></div>
</main>

<footer>

  <span class="lg"><i class="sw" style="background:var(--shivam)"></i>Shivam</span>
  <span class="lg"><i class="sw" style="background:#3F7D53"></i>shoot</span>
  <span class="lg"><i class="sw" style="background:#FAE9E9;border:1px solid #E8C7C8"></i>peak</span>
  <span class="lg"><i class="sw" style="background:#F7EFDF;border:1px solid var(--line)"></i>veg / fasting</span>
  <span class="lg"><i class="sw" style="background:#EBE7E0;border:1px solid var(--line)"></i>quiet period</span>
  <span style="margin-left:auto">View only · click any day for detail</span>
</footer>

<div class="ov" id="ov"></div>
<div class="panel" id="panel">
  <div class="ph" style="position:relative">
    <div class="d1" id="pd1">—</div>
    <div class="d2" id="pd2"></div>
    <button class="x" id="px">✕</button>

  <div class="pb" id="pb"></div>
</div>

  /* ============ render: month grid ============ */
  function renderMonth(){
    document.getElementById("dow").style.display = "";
    document.getElementById("grid").style.display = "";
    document.getElementById("agenda").style.display = "none";

    var dw = document.getElementById("dow");
    dw.innerHTML = "";
    DOWS.forEach(function(d){ var e=document.createElement("div"); e.textContent=d; dw.appendChild(e); });

    var g = document.getElementById("grid");
    g.innerHTML = "";

    var first = new Date(state.y, state.m, 1);
    var startOffset = (first.getDay()+6)%7;          // Monday-first
    var daysInMonth = new Date(state.y, state.m+1, 0).getDate();
    var prevDays = new Date(state.y, state.m, 0).getDate();
    var totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
    var trimQueue = [];

    for(var i=0;i<totalCells;i++){
      var dayNum, mm = state.m, yy = state.y, outside = false;
      if(i < startOffset){ dayNum = prevDays - startOffset + 1 + i; mm = state.m-1; outside = true; }
      else if(i >= startOffset+daysInMonth){ dayNum = i - startOffset - daysInMonth + 1; mm = state.m+1; outside = true; }
      else { dayNum = i - startOffset + 1; }
      if(mm<0){ mm=11; yy--; } if(mm>11){ mm=0; yy++; }
      var ds = key(yy, mm, dayNum);

      var cell = document.createElement("div");
      cell.className = "cell" + (outside ? " out" : "");
      if(!outside){
        var per = periodOn(ds);
        if(per) cell.className += " p-" + per.kind;
        if(ds === TODAY) cell.className += " today";
      }

      var head = document.createElement("div"); head.className = "cn";
      var n = document.createElement("div"); n.className = "n"; n.textContent = dayNum;
      head.appendChild(n);
      var f = festOn(ds);
      if(f && !outside){
        cell.className += " fest-day";
        var fe = document.createElement("div"); fe.className="f";
        fe.textContent = f.name.split("·")[0].trim();
        fe.title = f.name;
        head.appendChild(fe);
      }
      cell.appendChild(head);

      if(!outside){
        var box = document.createElement("div"); box.className = "items";
        var all = [];
        var sh = shootOn(ds);
        if(sh) all.push({k:"s", label:(sh.fixed ? "● " : "○ ") + sh.n});
        milesOn(ds).forEach(function(m){ all.push({k:"m", label:m.text}); });
        contentOn(ds).forEach(function(c){ all.push({k:"c", type:c.type, label:(TYPE_LABEL[c.type]||"POST")+" · "+c.title}); });
        tasksOn(ds).forEach(function(t){ all.push({k:"t", owner:t.owner, status:t.status, label:"#"+t.id+" "+t.task}); });

        all.forEach(function(item){
          var e = document.createElement("div");
          if(item.k==="s") e.className = "it s";
          else if(item.k==="m") e.className = "it m";
          else if(item.k==="c") e.className = "it c " + item.type;
          else e.className = "it t " + item.owner + (item.status==="Done"?" done":"") + (item.status==="Blocked"?" blocked":"");
          e.textContent = item.label;
          e.title = item.label;
          box.appendChild(e);
        });
        var more = document.createElement("div"); more.className="more"; more.style.display="none";
        box.appendChild(more);
        cell.appendChild(box);
        trimQueue.push({ box: box, more: more, total: all.length });
        (function(d){ cell.onclick = function(){ openDay(d); }; })(ds);
      }
      g.appendChild(cell);
    }

    /* Trim each cell to what actually fits, so "+N more" is never clipped.
       Runs after layout, so it measures real heights. */
    trimQueue.forEach(function(q){
      if(!q.total) return;
      var items = [].slice.call(q.box.querySelectorAll(".it"));
      var hidden = 0;
      // First pass: does everything fit as-is?
      if(q.box.scrollHeight <= q.box.clientHeight + 1) return;
      // Reveal the counter, then peel items off the end until it fits.
      q.more.style.display = "";
      while(items.length && q.box.scrollHeight > q.box.clientHeight + 1){
        var last = items.pop();
        last.style.display = "none";
        hidden++;
        q.more.textContent = "+" + hidden + " more";
      }
      if(hidden === 0){ q.more.style.display = "none"; }
      else { q.more.textContent = "+" + hidden + " more"; }
    });
  }

      ms.forEach(function(m){
        right.appendChild(arow("MILE", "#241A20", m.text, "", null));
      });
      cs.forEach(function(c){
        right.appendChild(arow(TYPE_LABEL[c.type]||"POST",
          c.type==="reel"?"#C13437":(c.type==="story"?"#B77A16":"#2F5F7D"),
          c.title, c.angle + (c.status?"  ·  "+c.status:""), null));
      });
      ts.forEach(function(t){
        right.appendChild(arow(t.priority, "#6E655C", "#"+t.id+"  "+t.task, t.criteria, t.owner));
      });
      if(!ms.length && !cs.length && !ts.length && !sh){
        var e=document.createElement("div"); e.className="aempty"; e.textContent="Festival only — nothing scheduled.";
        right.appendChild(e);
      }
      row.appendChild(right);
      a.appendChild(row);
    }

    if(!any){
      var e = document.createElement("div");
      e.className = "aempty";
      e.style.padding = "30px 0";
      e.textContent = "Nothing on the calendar for this month with the current filters.";
      a.appendChild(e);
    }
  }

  function arow(tag, colour, t1, t2, owner){
    var r = document.createElement("div"); r.className = "arow";
    var g = document.createElement("div"); g.className="tag"; g.style.background = colour; g.textContent = tag;
    r.appendChild(g);
    var b = document.createElement("div"); b.className="bd";
    var a1 = document.createElement("div"); a1.className="t1"; a1.textContent = t1; b.appendChild(a1);
    if(t2){ var a2=document.createElement("div"); a2.className="t2"; a2.textContent=t2; b.appendChild(a2); }
    r.appendChild(b);
    if(owner){
      var o = document.createElement("div"); o.className="own";
      o.style.background = OWNER_COLOUR[owner] || "#6E655C";
      o.textContent = owner;
      r.appendChild(o);
    }
    return r;
  }

  /* ============ day panel ============ */
  function openDay(ds){
    document.getElementById("pd1").textContent = (+ds.split("-")[2]) + " " + MON[+ds.split("-")[1]-1] + " " + ds.split("-")[0];
    var per = periodOn(ds);
    document.getElementById("pd2").textContent = longDow(ds) + (per ? "  ·  " + per.name : "");

    var b = document.getElementById("pb");
    b.innerHTML = "";

    var f = festOn(ds);
    if(f){
      var fb = document.createElement("div"); fb.className="fest";
      var fn = document.createElement("div"); fn.className="n"; fn.textContent = f.name; fb.appendChild(fn);
      if(f.note){ var fs=document.createElement("div"); fs.className="s"; fs.textContent=f.note; fb.appendChild(fs); }
      b.appendChild(fb);
    }

    var sh = shootOn(ds);
    if(sh){
      var sb = document.createElement("div"); sb.className="shoot";
      var sn = document.createElement("div"); sn.className="n";
      sn.textContent = sh.n + (sh.fixed ? "" : "  ·  " + (+sh.from.split("-")[2]) + "–" + (+sh.to.split("-")[2]) + " " + MON[+sh.to.split("-")[1]-1]);
      sb.appendChild(sn);
      var ss = document.createElement("div"); ss.className="s"; ss.textContent = sh.note; sb.appendChild(ss);
      b.appendChild(sb);
    }

    var ms = milesOn(ds);
    if(ms.length){
      b.appendChild(sect("Milestone", ms.map(function(m){
        var c=document.createElement("div"); c.className="pcard";
        var t=document.createElement("div"); t.className="t"; t.textContent=m.text; c.appendChild(t);
        return c;
      })));
    }

    var cs = contentOn(ds);
    b.appendChild(sect("Going out — " + cs.length, cs.length ? cs.map(function(c){
      var card=document.createElement("div"); card.className="pcard";
      card.style.borderLeftColor = c.type==="reel"?"#C13437":(c.type==="story"?"#B77A16":"#2F5F7D");
      var t=document.createElement("div"); t.className="t"; t.textContent=c.title; card.appendChild(t);
      if(c.angle){ var a=document.createElement("div"); a.className="c"; a.textContent=c.angle; card.appendChild(a); }
      var m=document.createElement("div"); m.className="m";
      m.appendChild(chip(TYPE_LABEL[c.type]||"POST","c-ink"));
      if(c.status) m.appendChild(chip(c.status, c.status==="Published"?"c-done":"c-todo"));
      card.appendChild(m);
      return card;
    }) : null));

    var ts = tasksOn(ds);
    b.appendChild(sect("Due — " + ts.length, ts.length ? ts.map(function(t){
      var card=document.createElement("div"); card.className="pcard "+t.owner;
      var h=document.createElement("div"); h.className="t"; h.textContent="#"+t.id+"  "+t.task; card.appendChild(h);
      if(t.criteria){ var c=document.createElement("div"); c.className="c"; c.textContent="Done = "+t.criteria; card.appendChild(c); }
      var m=document.createElement("div"); m.className="m";
      m.appendChild(chip(t.priority,"c-ink"));
      m.appendChild(chip(t.status,"c-"+t.status.toLowerCase()));
      var o=document.createElement("span"); o.className="chip";
      o.style.background=OWNER_COLOUR[t.owner]; o.style.color="#fff"; o.textContent=t.owner;
      m.appendChild(o);
      if(t.client!==C){ m.appendChild(chip(t.client,"c-todo")); }
      card.appendChild(m);
      return card;
    }) : null));

    document.getElementById("ov").classList.add("on");
    document.getElementById("panel").classList.add("on");
  }
  function sect(title, nodes){
    var s = document.createElement("div"); s.className="sect";
    var h = document.createElement("h4"); h.textContent = title; s.appendChild(h);
    if(!nodes){ var p=document.createElement("div"); p.className="pnone"; p.textContent="Nothing."; s.appendChild(p); }
    else nodes.forEach(function(n){ s.appendChild(n); });
    return s;
  }
  function chip(txt, cls){
    var e=document.createElement("span"); e.className="chip "+cls; e.textContent=txt; return e;
  }
  function closeDay(){
    document.getElementById("ov").classList.remove("on");
    document.getElementById("panel").classList.remove("on");
  }

  /* ============ subheader ============ */
  function renderSub(){
    var s = document.getElementById("sub");
    s.innerHTML = "";
    var daysInMonth = new Date(state.y, state.m+1, 0).getDate();
    var nC=0, nT=0, byOwner={Ram:0,Bipin:0,Shivam:0};
    for(var d=1;d<=daysInMonth;d++){
      var ds = key(state.y, state.m, d);
      nC += contentOn(ds).length;
      tasksOn(ds).forEach(function(t){ nT++; if(byOwner[t.owner]!==undefined) byOwner[t.owner]++; });
    }
    var mkey = state.y + "-" + String(state.m+1).padStart(2,"0");
    var bits = [];
    // Dec 2026 onward is anchors only — say so, so a low count doesn't read as a gap.
    if(mkey >= "2026-12" && mkey <= "2027-07"){
      bits.push("<b>"+nC+"</b> of <b>15</b> planned &mdash; anchors only, fill the rest on the 25th");
    } else {
      bits.push("<b>"+nC+"</b> piece"+(nC===1?"":"s")+" going out");
    }
    bits.push("<b>"+nT+"</b> task"+(nT===1?"":"s")+" due");
    bits.push("Ram <b>"+byOwner.Ram+"</b> · Bipin <b>"+byOwner.Bipin+"</b> · Shivam <b>"+byOwner.Shivam+"</b>");
    var per = [];
    PERIODS.forEach(function(p){
      var mStart = key(state.y, state.m, 1), mEnd = key(state.y, state.m, daysInMonth);
      if(p.to >= mStart && p.from <= mEnd) per.push(p.name);
    });
    if(ADS[mkey]) bits.push("Ads " + ADS[mkey]);
    if(per.length) bits.push(per.join("   ·   "));
    s.innerHTML = bits.join("&nbsp;&nbsp;&nbsp;·&nbsp;&nbsp;&nbsp;");
  }

  /* ============ main render ============ */
  function render(){
    document.getElementById("mtitle").textContent = MON[state.m] + " " + state.y;
    buildFilters();
    renderSub();
    if(state.view === "month") renderMonth(); else renderAgenda();
    Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function(b){
      b.classList.toggle("on", b.getAttribute("data-view") === state.view);
    });
  }

  /* ============ wiring ============ */
  document.getElementById("prev").onclick = function(){
    state.m--; if(state.m<0){ state.m=11; state.y--; } render();
  };
  document.getElementById("next").onclick = function(){
    state.m++; if(state.m>11){ state.m=0; state.y++; } render();
  };
  document.getElementById("today").onclick = function(){
    state.y = +TODAY.split("-")[0]; state.m = +TODAY.split("-")[1]-1; render();
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"), function(b){
    b.onclick = function(){ state.view = b.getAttribute("data-view"); render(); };
  });
  document.getElementById("printBtn").onclick = function(){ window.print(); };
  document.getElementById("ov").onclick = closeDay;
  document.getElementById("px").onclick = closeDay;
  document.onkeydown = function(e){
    if(e.key === "Escape") closeDay();
    if(e.key === "ArrowLeft") document.getElementById("prev").click();
    if(e.key === "ArrowRight") document.getElementById("next").click();
  };

  // Cell heights change with the window, so the "+N more" trim has to be redone.
  var rt;
  window.onresize = function(){ clearTimeout(rt); rt = setTimeout(render, 150); };

  render();
})();
</script>
</body>
</html>
